name: demo
on:
  workflow_dispatch:
  push:
    branches: [demo]
jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Record
        run: chmod +x ./gradlew && ./gradlew recordDemo --stacktrace
      - name: API help
        if: failure()
        run: |
          J=$(find ~/.gradle -name "fabric-client-gametest-api-v1*.jar" | grep -v sources | head -1); echo "$J"
          javap -cp "$J" net.fabricmc.fabric.api.client.gametest.v1.context.ClientGameTestContext || true
          javap -cp "$J" net.fabricmc.fabric.api.client.gametest.v1.context.TestSingleplayerContext || true
          javap -cp "$J" net.fabricmc.fabric.api.client.gametest.v1.world.TestClientLevelContext || true
      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-frames
          path: |
            build/run/clientGameTest/screenshots
            build/run/**/screenshots
          if-no-files-found: warn
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-logs
          path: build/run/**/logs/latest.log
          if-no-files-found: ignore
