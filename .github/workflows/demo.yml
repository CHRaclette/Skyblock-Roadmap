name: demo
on:
  workflow_dispatch:
  push:
    branches: [demo]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb ffmpeg
      - name: Record
        run: chmod +x ./gradlew && ./gradlew recordDemo --stacktrace
      - name: API help
        if: failure()
        run: |
          J=$(find ~/.gradle -name "fabric-client-gametest-api-v1*.jar" | grep -v sources | head -1); echo "$J"
          javap -cp "$J" net.fabricmc.fabric.api.client.gametest.v1.context.ClientGameTestContext || true
          javap -cp "$J" net.fabricmc.fabric.api.client.gametest.v1.context.TestSingleplayerContext || true
          javap -cp "$J" net.fabricmc.fabric.api.client.gametest.v1.world.TestClientLevelContext || true
      - name: Collect frames
        if: always()
        run: |
          F=$(find "$GITHUB_WORKSPACE" "$HOME" /tmp -name "*frame_00000*" 2>/dev/null | head -1); echo "first frame: $F"
          mkdir -p out && if [ -n "$F" ]; then cp "$(dirname "$F")"/*frame_*.png out/; fi; ls out | wc -l; ls out | head -3
      - name: Encode video and publish it as the demo-video release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ffmpeg -v error -y -framerate 20 -pattern_type glob -i 'out/*.png' -c:v libx264 -preset slow -crf 16 -pix_fmt yuv420p demo_raw.mp4
          ffmpeg -v error -y -pattern_type glob -i 'out/*.png' -vf "select='not(mod(n\,40))',scale=427:-1,tile=4x6" -frames:v 1 demo_sheet.png
          ls -la demo_raw.mp4 demo_sheet.png
          gh release delete demo-video --yes --cleanup-tag || true
          gh release create demo-video demo_raw.mp4 demo_sheet.png --prerelease --title "Demo recording" --notes "Recorded automatically in a real Minecraft 26.2 client." --target "$GITHUB_SHA"
      - name: Upload frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-frames
          path: out
          if-no-files-found: warn
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-logs
          path: build/run/**/logs/latest.log
          if-no-files-found: ignore
