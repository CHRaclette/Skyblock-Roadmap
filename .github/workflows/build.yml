name: inspect
on: push
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build
        run: chmod +x ./gradlew && ./gradlew build --stacktrace || true
      - name: Inspect
        run: |
          JAR=$(find ~/.gradle -name "minecraft-merged-deobf-26.2.jar" | head -1)
          p() { echo "===== $1"; javap -cp "$JAR" "$1" | grep -i "$2" | head -40; }
          p net.minecraft.client.Minecraft "connection\|getConnection\|resourceManager\|getResourceManager\|getModelManager"
          p net.minecraft.client.multiplayer.ClientPacketListener "PlayerInfo\|Players\|scoreboard"
          p net.minecraft.client.multiplayer.PlayerInfo "Name\|profile\|Profile"
          p net.minecraft.server.packs.resources.ResourceManager "."
          p net.minecraft.server.packs.resources.ResourceProvider "."
          p net.minecraft.core.component.DataComponents "ITEM_MODEL\|PROFILE\|DYED_COLOR\|GLINT\|CUSTOM_NAME"
          p net.minecraft.world.item.component.DyedItemColor "public"
          p net.minecraft.world.item.component.ResolvableProfile "static"
          p net.minecraft.client.resources.model.ModelManager "public"
          p net.minecraft.world.scores.Scoreboard "public .*Objective\|DisplaySlot\|listPlayerScores\|getPlayerTeam"
