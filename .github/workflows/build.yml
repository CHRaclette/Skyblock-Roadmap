name: inspect
on: push
permissions:
  contents: write
jobs:
  clip:
    runs-on: ubuntu-24.04
    steps:
      - name: Reference clip -> contact sheets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q yt-dlp
          yt-dlp -f "bv*[height<=1080]+ba/b" -o "clip.%(ext)s" "https://youtube.com/shorts/Bu3GizNxVLs" 2>&1 | tail -5 || true
          ls -la
          F=$(ls clip.* 2>/dev/null | head -1); [ -z "$F" ] && exit 0
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F"); echo "duration $D"
          ffmpeg -v error -y -i "$F" -vf "fps=24/$D,scale=240:-1,tile=8x3" -frames:v 1 sheet_all.png
          ffmpeg -v error -y -i "$F" -vf "fps=4,scale=320:-1,tile=6x5" -frames:v 1 sheet_fast.png
          ffmpeg -v error -y -ss 0 -t 8 -i "$F" -vf "fps=5,scale=320:-1,tile=8x5" -frames:v 1 sheet_a.png
          ffmpeg -v error -y -ss 8 -t 8 -i "$F" -vf "fps=5,scale=320:-1,tile=8x5" -frames:v 1 sheet_b.png
          gh release delete ref-tmp --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create ref-tmp sheet_*.png --prerelease --title "temp reference" --notes "temp, will be deleted" -R ${{ github.repository }} --target ${{ github.sha }}
  sound:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Sound check in a real client
        run: chmod +x ./gradlew && ./gradlew recordDemo --stacktrace 2>&1 | grep -iE "SOUNDCHECK|sound|openal|unknown|BUILD|error:" | head -60
