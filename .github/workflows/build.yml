name: inspect
on: push
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Wiki
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          for p in "Changelog/2024/August_20" "Crystal_Nucleus" "RNG_Meter"; do
            echo "=================== $p"
            curl -sS -A "$UA" "https://hypixelskyblock.minecraft.wiki/w/$p?action=raw" -o page.txt -w "%{http_code}\n"
            wc -c page.txt
            grep -n -i -A60 "RNG Meter" page.txt | head -150
          done
