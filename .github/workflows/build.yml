name: inspect
on: push
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build
        run: chmod +x ./gradlew && ./gradlew build --stacktrace -x test || true
      - name: Inspect
        run: |
          JAR=$(find ~/.gradle -name "minecraft-merged-deobf-26.2.jar" | head -1)
          for c in com.mojang.blaze3d.platform.NativeImage net.minecraft.client.renderer.texture.DynamicTexture net.minecraft.client.renderer.texture.TextureManager net.minecraft.client.renderer.texture.AbstractTexture; do echo "===== $c"; javap -cp "$JAR" $c | grep -i "public" | grep -iv "lambda" | head -40; done
          curl -s https://api.hypixel.net/v2/resources/skyblock/items -o items.json
          python3 -c "
          import json,base64
          d=json.load(open('items.json'))['items']
          for i in d:
              if i['id'] in ('JUDGEMENT_CORE','ARCHFIEND_DICE','HIGH_CLASS_ARCHFIEND_DICE','WARDEN_HEART','OVERFLUX_CAPACITOR','DIGESTED_MOSQUITO','DEEP_SEA_ORB','DARK_ORB','MANTI_CORE','SCATHA'):
                  sk=i.get('skin',{}).get('value') if isinstance(i.get('skin'),dict) else None
                  url=json.loads(base64.b64decode(sk+'==='))['textures']['SKIN']['url'] if sk else None
                  print(i['id'], i.get('material'), i.get('item_model'), url)
          "
