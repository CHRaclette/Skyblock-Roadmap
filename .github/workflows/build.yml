name: cleanup
on: push
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete the temporary pack release (Hypixel pack must not be redistributed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete pack-inspect --yes --cleanup-tag -R ${{ github.repository }} || true
