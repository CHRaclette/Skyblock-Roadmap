name: inspect
on: push
permissions:
  contents: write
jobs:
  clip:
    runs-on: ubuntu-24.04
    steps:
      - name: Reference clip -> contact sheets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q yt-dlp
          V=Bu3GizNxVLs
          for c in "tv" "web_safari" "ios" "android_vr" "mweb"; do yt-dlp --extractor-args "youtube:player_client=$c" -f "b[height<=1080]/bv*+ba/b" -o "clip.%(ext)s" "https://www.youtube.com/watch?v=$V" 2>&1 | tail -2; ls clip.* 2>/dev/null && break; done
          if ! ls clip.* >/dev/null 2>&1; then for h in pipedapi.kavin.rocks api.piped.private.coffee pipedapi.adminforge.de; do U=$(curl -s --max-time 20 "https://$h/streams/$V" | python3 -c "import sys,json;d=json.load(sys.stdin);s=[x for x in d.get('videoStreams',[]) if not x.get('videoOnly')] or d.get('videoStreams',[]);print(s[0]['url'])" 2>/dev/null); echo "piped $h -> ${U:0:60}"; [ -n "$U" ] && curl -sL --max-time 60 -o clip.mp4 "$U" && [ -s clip.mp4 ] && break; rm -f clip.mp4; done; fi
          if ! ls clip.* >/dev/null 2>&1; then for h in inv.nadeko.net yewtu.be invidious.nerdvpn.de; do curl -sL --max-time 60 -o clip.mp4 "https://$h/latest_version?id=$V&itag=18"; echo "inv $h $(stat -c %s clip.mp4 2>/dev/null)"; [ "$(stat -c %s clip.mp4 2>/dev/null || echo 0)" -gt 100000 ] && break; rm -f clip.mp4; done; fi
          ls -la
          F=$(ls clip.* 2>/dev/null | head -1); [ -z "$F" ] && exit 0
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$F"); echo "duration $D"
          ffmpeg -v error -y -i "$F" -vf "fps=24/$D,scale=240:-1,tile=8x3" -frames:v 1 sheet_all.png
          ffmpeg -v error -y -i "$F" -vf "fps=4,scale=320:-1,tile=6x5" -frames:v 1 sheet_fast.png
          ffmpeg -v error -y -ss 0 -t 8 -i "$F" -vf "fps=5,scale=320:-1,tile=8x5" -frames:v 1 sheet_a.png
          ffmpeg -v error -y -ss 8 -t 8 -i "$F" -vf "fps=5,scale=320:-1,tile=8x5" -frames:v 1 sheet_b.png
          gh release delete ref-tmp --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create ref-tmp sheet_*.png --prerelease --title "temp reference" --notes "temp, will be deleted" -R ${{ github.repository }} --target ${{ github.sha }}
