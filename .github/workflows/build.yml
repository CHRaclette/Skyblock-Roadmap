name: inspect
on: push
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build
        run: chmod +x ./gradlew && ./gradlew build --stacktrace || true
      - name: Inspect
        run: |
          JAR=$(find ~/.gradle -name "minecraft-merged-deobf-26.2.jar" | head -1)
          echo "===== Minecraft"; javap -cp "$JAR" net.minecraft.client.Minecraft | grep -i "screen\|gui"
