name: inspect
on: push
permissions:
  contents: write
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - name: Home chunk
        run: |
          curl -sL https://ytshortdown.com/_next/static/chunks/pages/home-d0d7e4180e3b5be6.js -o h.js
          python3 - <<'PY'
          s=open('h.js').read()
          for k in ['random-cdn','/v2/info','/download','decrypt','AES','importKey','subtle','atob']:
              i=s.find(k)
              if i>=0: print('###',k); print(s[max(0,i-1500):i+1200]); print()
          PY
