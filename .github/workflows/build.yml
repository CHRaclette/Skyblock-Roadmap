name: inspect
on: push
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build
        run: chmod +x ./gradlew && ./gradlew build --stacktrace || true
      - name: Inspect
        run: |
          JAR=$(find ~/.gradle -name "minecraft-merged-deobf-26.2.jar" | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle .gradle -name "minecraft-*26.2*.jar" | grep -v sources | head -1)
          echo "JAR $JAR"
          for c in net.minecraft.client.gui.screens.inventory.AbstractContainerScreen net.minecraft.world.inventory.Slot net.minecraft.world.inventory.AbstractContainerMenu net.minecraft.client.gui.screens.Screen; do echo "===== $c"; javap -p -cp "$JAR" $c | grep -v "lambda\$" | head -120; done
          for j in $(find ~/.gradle -name "fabric-screen-api-v1*.jar" | grep -v sources | head -1); do echo "== $j"; unzip -l $j | grep class | head -30; for c in net.fabricmc.fabric.api.client.screen.v1.ScreenEvents net.fabricmc.fabric.api.client.screen.v1.ScreenMouseEvents 'net.fabricmc.fabric.api.client.screen.v1.ScreenMouseEvents$AfterMouseClick' 'net.fabricmc.fabric.api.client.screen.v1.ScreenEvents$Remove' 'net.fabricmc.fabric.api.client.screen.v1.ScreenEvents$AfterInit'; do echo "===== $c"; javap -cp "$j" "$c"; done; done
