name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: butcher-drops
          path: build/libs/*.jar
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "Butcher Drops (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Put the .jar in your .minecraft/mods folder (Fabric 26.2 + Fabric API)."
